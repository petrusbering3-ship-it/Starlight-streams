name: Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-scripts:
    name: Check installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Parse every script with Windows PowerShell 5.1 (the one built into Windows)
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem installer -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  build:
    name: Build Windows installers
    needs: check-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-x86_64-pc-windows-gnu

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Cross
        run: cargo binstall --force cross
      - name: Install Wasm-Bindgen
        run: cargo binstall --no-confirm --force wasm-bindgen-cli@0.2.128

      - name: Build
        run: |
          cross build --release --target x86_64-pc-windows-gnu
          npm ci
          npm run build

      - name: Package
        run: |
          BIN=target/x86_64-pc-windows-gnu/release

          mkdir -p out/Starlight-Streams-Laptop out/Starlight-Streams-PC

          cp $BIN/web-server.exe out/Starlight-Streams-Laptop/
          cp -r dist out/Starlight-Streams-Laptop/static
          cp installer/laptop/* LICENSE out/Starlight-Streams-Laptop/

          cp $BIN/starlight-power-agent.exe out/Starlight-Streams-PC/
          cp installer/pc/* LICENSE out/Starlight-Streams-PC/

          cd out
          zip -r Starlight-Streams-Laptop.zip Starlight-Streams-Laptop
          zip -r Starlight-Streams-PC.zip Starlight-Streams-PC

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: starlight-streams-windows-installers
          path: |
            out/Starlight-Streams-Laptop.zip
            out/Starlight-Streams-PC.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/Starlight-Streams-Laptop.zip
            out/Starlight-Streams-PC.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

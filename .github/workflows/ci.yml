name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Format check
      - name: Rustfmt
        run: cargo fmt --all -- --check

      # Clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Binstall
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Cargo Shear
      - name: Install cargo-shear
        run: cargo binstall --force --no-confirm cargo-shear
      - name: Cargo Shear
        run: cargo shear
  
      # Test
      - name: Test
        run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            app-suffix: .exe
          - target: x86_64-unknown-linux-gnu
            app-suffix: ""
          - target: x86_64-unknown-linux-musl
            app-suffix: ""
          - target: aarch64-unknown-linux-gnu
            app-suffix: ""
          - target: aarch64-unknown-linux-musl
            app-suffix: ""
          - target: aarch64-apple-darwin
            app-suffix: ""
            runner: macos-26
          - target: x86_64-apple-darwin
            app-suffix: ""
            runner: macos-26-intel

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
  
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
  
    # Install node
    - uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: npm
  
    # Install Rust
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: cross-${{ matrix.target }}
  
    # Install cross, wasm-bindgen
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main
    - name: Install Cross
      run: cargo binstall --force cross
    - name: Install Wasm-Bindgen
      run: cargo binstall --no-confirm --force wasm-bindgen-cli@0.2.128
  
    # Build
    - name: Build
      run: |
        cross build --release --target ${{ matrix.target }}
  
        npm ci
        npm run build
        mv dist static
  
        rm -rf web-server
        mv target/${{ matrix.target }}/release/web-server${{ matrix.app-suffix }} web-server${{ matrix.app-suffix }}
  
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: starlight-streams-${{ matrix.target }}
        path: |
          web-server${{ matrix.app-suffix }}
          static

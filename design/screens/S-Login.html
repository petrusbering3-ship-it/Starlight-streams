<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<meta name="viewport" content="width=1366">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../starlight-swiss.css">
<style>body{margin:0;background:#f3f2ee}</style>
</head>
<body>
<div class="sl" style="position: relative; width: 1366px; height: 768px; overflow: hidden; background: var(--sl-paper); "><div style="display: grid; grid-template-columns: minmax(0, 1fr) 520px; height: 100%">
<div style="display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; border-right: 1px solid var(--sl-ink)">
<div style="display: flex; justify-content: space-between"><span class="sl-label">Starlight Streams</span><span class="sl-label">v2.3.1 · fork of Moonlight Web</span></div>
<h1 class="sl-display" style="font-size: 132px; line-height: .86; letter-spacing: -.055em">Starlight<br>Streams<span class="sl-red">.</span></h1>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; border-top: 1px solid var(--sl-ink); padding-top: 14px"><div style="display: flex; flex-direction: column; gap: 4px"><span class="sl-mono sl-muted">01</span><span style="font-weight: 600">Turn it on</span><span class="sl-muted" style="font-size: 12.5px">Wake your PC from anywhere.</span></div><div style="display: flex; flex-direction: column; gap: 4px"><span class="sl-mono sl-muted">02</span><span style="font-weight: 600">Pick a screen</span><span class="sl-muted" style="font-size: 12.5px">Any display, laid out like Windows.</span></div><div style="display: flex; flex-direction: column; gap: 4px"><span class="sl-mono sl-muted">03</span><span style="font-weight: 600">Play</span><span class="sl-muted" style="font-size: 12.5px">In the browser. Chromebook or phone.</span></div></div></div>
<form style="display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 56px; background: var(--sl-white); height: 100%">
<div style="display: flex; justify-content: flex-end; gap: 14px; margin-bottom: auto"><button class="sl-link sl-label" type="button" style="color: var(--sl-ink); background-size: 100% 1px">EN</button><button class="sl-link sl-label" type="button" style="color: var(--sl-grey); ">DA</button></div><h2 class="sl-h2" style="font-size: 34px">Log in</h2>
<div class="sl-field"><label class="sl-label" for="ufocusen">Username</label><input id="ufocusen" class="sl-input" type="text" autocomplete="username" value="petrus"></div>
<div class="sl-field"><label class="sl-label" for="pfocusen">Password</label><input id="pfocusen" class="sl-input is-focus" type="password" autocomplete="current-password" value="••••••••••"></div>
<button class="sl-btn sl-btn-ink sl-btn-lg sl-btn-block" type="submit">Log in<span aria-hidden="true">→</span></button><span class="sl-muted" style="font-size: 12px; margin-top: auto">Ask the admin if you forgot your password.</span></form></div></div>
</body>
</html>

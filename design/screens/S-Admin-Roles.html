<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin roles</title>
<meta name="viewport" content="width=1366">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../starlight-swiss.css">
<style>body{margin:0;background:#f3f2ee}</style>
</head>
<body>
<div class="sl" style="position: relative; width: 1366px; height: 768px; overflow: hidden; background: var(--sl-paper); "><div class="sl-statusbar"><span class="sl-label">Server online · 4 ms</span><span class="sl-label">v2.3.1</span></div><header class="sl-header"><a class="sl-link" href="S-Home.dc.html"><svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back</a><span class="sl-h3" style="margin-right: auto">Admin</span><span class="sl-tag sl-tag--role">Admin</span></header>
<div style="padding: 0 40px"><div class="sl-tabs" role="tablist"><button class="sl-tab" role="tab" type="button" aria-selected="false">Users</button><button class="sl-tab" role="tab" type="button" aria-selected="true">Roles</button></div></div>
<main style="display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 56px; padding: 26px 40px">
<section style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; gap: 8px"><div style="position: relative; flex: 1"><input class="sl-input sl-input-sm" type="search" placeholder="Search" aria-label="Search" style="padding-left: 32px"><span style="position: absolute; left: 10px; top: 11px; color: var(--sl-grey)"><svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span></div><button class="sl-btn sl-btn-ink" type="button" style="height: 38px; padding: 0 12px"><svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add role</button></div><div class="sl-index"><button class="sl-index-row" type="button"><span class="sl-mono sl-muted">01</span><span style="display: flex; flex-direction: column"><span class="name" style="font-size: 15px">Admin</span><span class="sl-muted" style="font-size: 12px">Admin · 1 user</span></span><span></span></button><button class="sl-index-row" type="button" aria-current="true"><span class="sl-mono sl-muted">02</span><span style="display: flex; flex-direction: column"><span class="name" style="font-size: 15px">Family</span><span class="sl-muted" style="font-size: 12px">User · 3 users</span></span><span></span></button><button class="sl-index-row" type="button"><span class="sl-mono sl-muted">03</span><span style="display: flex; flex-direction: column"><span class="name" style="font-size: 15px">Friends</span><span class="sl-muted" style="font-size: 12px">User · 1 user</span></span><span></span></button><button class="sl-index-row" type="button"><span class="sl-mono sl-muted">04</span><span style="display: flex; flex-direction: column"><span class="name" style="font-size: 15px">Guest</span><span class="sl-muted" style="font-size: 12px">Guest · links</span></span><span></span></button></div></section>
<section style="display: flex; flex-direction: column; min-width: 0"><div style="display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--sl-ink)"><div style="display: flex; flex-direction: column; gap: 8px"><span class="sl-label">Role · 3 users</span><h1 class="sl-h1">Family</h1></div></div>
<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; padding: 22px 0 18px"><div class="sl-field"><label class="sl-label">Role name</label><input class="sl-input" type="text" value="Family"></div><div class="sl-field"><label class="sl-label">Type</label><button class="sl-select" type="button" style="height: 48px; border-color: var(--sl-ink)">User<svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div></div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 0; border-top: 1px solid var(--sl-hair)"><span class="sl-label">Permissions</span><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 20px"><label class="sl-check"><input type="checkbox">Allow adding hosts</label><label class="sl-check"><input type="checkbox" checked>Allow WebRTC</label><label class="sl-check"><input type="checkbox" checked>Allow Web Sockets</label><label class="sl-check"><input type="checkbox" checked>Allow H264</label><label class="sl-check"><input type="checkbox" checked>Allow H265</label><label class="sl-check"><input type="checkbox">Allow AV1</label><label class="sl-check"><input type="checkbox">Allow HDR</label></div></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; padding: 16px 0; border-top: 1px solid var(--sl-hair)">
<div class="sl-field"><label class="sl-label">Max bitrate</label><div style="position: relative"><input class="sl-input sl-mono" type="text" value="30000"><span class="sl-mono sl-muted" style="position: absolute; right: 14px; top: 16px; font-size: 12px">Kbps</span></div><span class="sl-help">Users in this role can’t go higher.</span></div>
<div class="sl-field"><label class="sl-label">Default settings</label><button class="sl-btn" type="button" style="height: 48px; justify-content: space-between">Balanced · 1080p · Auto codec<svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><span class="sl-help">Opens Settings. Save with “Save as role defaults”.</span></div></div>
<div style="display: flex; gap: 8px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--sl-ink)"><button class="sl-btn sl-btn-danger" type="button"><svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete</button><button class="sl-btn sl-btn-quiet" type="button" style="margin-left: auto">Reset</button><button class="sl-btn sl-btn-ink is-loading" type="button" aria-busy="true" style="min-width: 130px">Apply<span>→</span></button></div></section></main></div>
</body>
</html>

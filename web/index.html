<!DOCTYPE html>
<html lang="en" class="notranslate">

<head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <title>Starlight Streams</title>
    <link rel="icon" href="resources/moonlight.svg" sizes="any" type="image/svg+xml">

    <script src="./config.js"></script>

    <!-- Manifest for Mobile Apps as Website -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="description" content="Starlight Streams for game streaming with your pc" />
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Starlight Streams">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
            const language = parsed && (parsed.language === "zh-CN" || parsed.language === "zh" || parsed.language === "zh_CN")
                ? "zh-CN"
                : "en";
            document.documentElement.lang = language;
            document.documentElement.translate = false;
            document.documentElement.classList.add("notranslate");
        } catch (_err) { }
    </script>
    <!-- Swiss Console fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded without blocking the page: without internet the system fonts are used -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>

<body class="sl">
    <!-- Modal -->
    <div id="modal-overlay" class="modal-background modal-disabled">
        <!-- Modal Content -->
        <div id="modal-parent" class="modal-content">
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu-background context-menu-disabled">
    </div>

    <!-- Notification -->
    <div id="notification-list">
    </div>

    <!-- Main App View -->
    <div id="root" class="root">
    </div>

</body>

</html>

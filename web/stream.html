<!DOCTYPE html>
<html lang="en" class="stream notranslate">

<head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widgets=overlays-content" />
    <title>Stream</title>
    <!-- Starlight Streams: black from the first moment (continues the black box from the home page) -->
    <style>html, body { background: #000; }</style>
    <link rel="icon" href="resources/moonlight.svg" sizes="any" type="image/svg+xml">

    <script src="./config.js"></script>

    <script>
        try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
            const language = parsed && (parsed.language === "zh-CN" || parsed.language === "zh" || parsed.language === "zh_CN")
                ? "zh-CN"
                : "en";
            document.documentElement.lang = language;
            document.documentElement.translate = false;
            document.documentElement.classList.add("notranslate");
        } catch (_err) { }
    </script>
    <!-- Swiss Console fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded without blocking the page: without internet the system fonts are used -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>

<body class="sl stream">
    <!-- Modal -->
    <div id="modal-overlay" class="sl-scrim" hidden>
        <!-- Modal Content -->
        <div id="modal-parent" class="sl-modal" role="dialog" aria-modal="true">
        </div>
    </div>

    <!-- Sidebar (Swiss Console, design/screens/S-Sidebar) -->
    <div id="sidebar-root" class="sl-sidebar-root">
        <div id="sidebar-backdrop" class="sl-sidebar-backdrop"></div>
        <button id="sidebar-button" class="sl-handle" type="button" aria-label="Open stream controls">
            <svg class="sl-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <aside id="sidebar-parent" class="sl-sidebar" data-open="false" aria-label="Stream controls">
        </aside>
    </div>

    <!-- Notification -->
    <div id="notification-list" class="sl-toasts" aria-live="polite">
    </div>

    <!-- A dummy element for capturing inputs -->
    <div id="input" tabindex="0"></div>

    <!-- Main App View -->
    <div id="root">
    </div>

</body>

</html>
